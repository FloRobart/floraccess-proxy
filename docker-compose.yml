# Reverse proxy of the server: the only entry point on ports 80 and 443.
#
# Everything it serves is declared in dynamic/: routes, middlewares and TLS options.
# It has no access to the Docker API on purpose: if compromised, Traefik could not read what
# the other containers hold, and a container cannot declare a route for itself.
#
# floraccess-wrapper deploys this file, and connects Traefik to the network of each exposed service.

x-hardened-service: &hardened-service
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  ipc: none

  # Core dumps would contain the private keys of the certificates held in memory
  ulimits:
    core: 0

  # Access logs are driven by external requests: without rotation they could fill the disk
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  traefik:
    <<: *hardened-service

    # Written in full in each service, not through a YAML anchor: Dependabot cannot update an anchor,
    # and it updates every service of the same image together in the same pull request
    image: traefik:v3.7.17@sha256:68ae5fe5b64ca166704b746a9e8afcd385e36b3f569a5691401bf652d57b3748
    restart: unless-stopped

    # NET_BIND_SERVICE is not needed: Docker allows unprivileged processes to bind port 80 inside a container
    user: "1800:1800"

    command:
      # No outgoing call that is not needed to serve traffic
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=${TRAEFIK_ACCESS_LOG:-true}

      # Used by the healthcheck below. Port 8080 is not published and only answers /ping.
      - --ping=true

      # Plain HTTP only redirects to HTTPS. The Let's Encrypt challenge still goes through.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure

      # These defaults apply to every route, so a route cannot forget them.
      # "asdefault" keeps a route that names no entrypoint away from plain HTTP.
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asdefault=true
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.middlewares=rate-limit@file,security-headers@file

      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

      - --providers.file.directory=/etc/traefik/dynamic

    ports:
      - 80:80
      - 443:443

    volumes:
      - letsencrypt:/letsencrypt
      - ./dynamic:/etc/traefik/dynamic:ro

    networks:
      - traefik-net

    depends_on:
      traefik-certificates-init:
        condition: service_completed_successfully

    # Resource limits: a flood of requests must not starve the other containers of the host
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 256

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  # One-shot service: a new volume belongs to root, and Traefik does not run as root
  traefik-certificates-init:
    <<: *hardened-service
    # Same image as the traefik service: it already contains sh, chown and chmod
    image: traefik:v3.7.17@sha256:68ae5fe5b64ca166704b746a9e8afcd385e36b3f569a5691401bf652d57b3748
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1800:1800 /letsencrypt && chmod 700 /letsencrypt"]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - letsencrypt:/letsencrypt
    network_mode: none
    mem_limit: 32m
    pids_limit: 16


volumes:
  letsencrypt:


networks:
  # The only network of Traefik with a gateway, so ports 80 and 443 are published through it
  # whatever the other networks it joins. No application joins this network.
  # Without IPv6, Docker would relay the IPv6 visitors in IPv4: they would all reach Traefik
  # with the same address, and share a single rate limit.
  traefik-net:
    name: traefik-net
    enable_ipv6: true
